# @package _global_

defaults:
  - _self_
  - data: tofu_chat3
  - data_mode: recap_a1
  - model: llama-3-8b
  - model_mode: uld
  - unlearn_loss: factorial_reference_preserving

trainer:
  batch_size: 8
  gradient_accumulation_steps: 4
  max_epochs: 10
  # Positive values override max_epochs with an exact optimizer-step budget.
  max_steps: null
  learning_rate: 2e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  optim: adamw_torch
  report_to: none
  seed: 42
  strategy: gpu

project: debug
name: null #! Set at runtime
debug: false
resume: false
postfix: ""
base_logdir: null #! Set at runtime
seed: 42

save_dir: outputs/model_dir/
BASELOGDIR: "outputs/tune_log"
OUTPUTMODELDIR: "outputs_trained_models"

hydra:
  run:
    dir: ${BASELOGDIR}/${hydra.job.name}/${hydra.job.override_dirname}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    config:
      override_dirname:
        exclude_keys:
          - save_dir
          - BASELOGDIR
          - OUTPUTMODELDIR
          - data
          - data.conv_template
          - trainer.*
          - model
